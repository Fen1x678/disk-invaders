name: Bug report
description: Something broke
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    attributes:
      label: OS and version
      placeholder: macOS 15.1 / Windows 11 23H2
    validations:
      required: true
  - type: input
    attributes:
      label: Disk Invaders version
