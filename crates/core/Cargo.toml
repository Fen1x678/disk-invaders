[package]
name = "invaders-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Disk scanner, junk rules and safe-delete logic behind Disk Invaders"
license = "MIT"
publish = false

[dependencies]
blake3 = "1.5"
dirs = "6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
