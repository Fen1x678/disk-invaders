[package]
name = "disk-invaders"
version = "0.1.0"
description = "A retro 80s arcade disk cleaner for macOS and Windows"
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
invaders-core = { path = "../crates/core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
